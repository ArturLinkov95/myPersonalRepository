<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="./style.css" type="text/css">
</head>

<body>
    <div class="calc">
        <div class="aroundCalc">
            <h1 class="title">Калькулятор</h1>
            <div class="manipulation">
                <input type="number" class="operand" id="operandOne">
                <select id="operation">
                    <option value="add">+</option>
                    <option value="subtr">-</option>
                    <option value="mult">*</option>
                    <option value="division">/</option>
                </select>
                <input type="number" class="operand" id="operandTwo">

                <button class="buttonResult" id="buttonResult">=</button>
                <div id="divResult" class="divResult">
                    <div id="result"></div>

                </div>
            </div>
        </div>

    </div>
    <script src="./main.js"></script>
</body>

</html>
