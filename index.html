<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="./style.css" type="text/css">
</head>

<body>
    <div class="wrapperToDo" id="wrapperToDo">
        <div class="divCont">
            <h2 class="priorityTitle">High</h2>

            <div class="inputTaskContainer">
                <form class="inputContainer">
                    <input class="input" type="text" name="task" required placeholder="Добавить важных дел">
                    <button type="submit" class="addButton">+</button>
                </form>
            </div>

            <h2 class="priorityTitle">Medium</h2>

            <div class="inputTaskContainer">
                <form class="inputContainer">
                    <input class="input" type="text" name="task" required placeholder="Добавить важных дел">
                    <button type="submit" class="addButton">+</button>
                </form>
            </div>

            <h2 class="priorityTitle">Low</h2>

            <div class="inputTaskContainer">
                <form class="inputContainer">
                    <input class="input" type="text" name="task" required placeholder="Добавить важных дел">
                    <button type="submit" class="addButton">+</button>
                </form>
            </div>

        </div>

        <script type="module" src="./main.js"></script>
</body>

</html>
