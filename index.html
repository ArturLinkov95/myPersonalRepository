<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат: Вёрстка</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="wrapper">
        <div class="chat-panel">
            <button class="button-settings">Настройки</button>
            <button class="button-exit">Выйти</button>
        </div>
        <div class="chat">
            <div class="message-me">
                <p class="message-text">Я: Добрый день!</p>
                <p class="message-time">18:45</p>
            </div>
            <div class="message-interlocutor">
                <p class="message-text">Миша О: Добрый день</p>
                <p class="message-time">18:45</p>
            </div>
            <div class="message-interlocutor">
                <p class="message-text">Миша О: А это второе и, кажется, <br>
                    оно очень <br>
                    длинное, чтобы поместиться на <br>
                    одной строке</p>
                <p class="message-time">18:45</p>
            </div>
            <div class="message-me">
                <p class="message-text">Я: Добрый день!</p>
                <p class="message-time">18:45</p>
            </div>
        </div>
        <div class="chat-send">
            <input type="text" class="chat-input" placeholder="Сообщение...">
            <button class="button-send">-></button>
        </div>
    </div>
</body>

</html>
