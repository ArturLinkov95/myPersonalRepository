<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратный отсчет</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="wrapper">

        <form>
            <div>
                <label>Введите дату:</label>
            </div>
            <div class="input-button-div">
                <input type="date" id="inputFutureDate">
                <button id="dateButton">Посчитать</button>
            </div>
        </form>

        <h2>Осталось времени:</h2>
        <span id="spanYears">
            <!-- 10 лет -->
        </span>
        <span id="spanDays">
            <!-- 364 дня -->
        </span>
        <span id="spanHours">
            <!-- 23 часа -->
        </span>
    </div>
    <script src="main.js" type="module"></script>
</body>

</html>
